<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Записать еду</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* Дизайн B «Тёплый шалфей»: кремовый фон, приглушённый зелёный, мягкие круглые формы.
     Тёмная тема — по теме Telegram (или системы, если открыто в браузере). */
  :root {
    --bg: #F5F3EC; --card: #FFFFFF; --text: #2A2F27; --hint: #676C60; --line: #E2DED2;
    --accent: #4E6E50; --on-accent: #FFFFFF; --pale: #E3EADF; --pale-text: #3A553C;
    --shade: rgba(42, 47, 39, .40); --danger: #A8432F;
  }
  :root[data-theme="dark"] {
    --bg: #1A1D18; --card: #252A23; --text: #ECEDE7; --hint: #A3A89B; --line: #343A31;
    --accent: #8DB38F; --on-accent: #11140F; --pale: #2F3A2D; --pale-text: #CFE3CF;
    --shade: rgba(0, 0, 0, .55); --danger: #E59A8A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 0 16px 100px; }
  button { font: inherit; color: inherit; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: 18px 2px 12px; }
  h2 { font-size: 17px; font-weight: 800; margin: 20px 2px 10px; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 2px 0 8px; }
  .searchbox { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 25px;
    background: var(--card); border: 1px solid var(--line); }
  .searchbox svg { flex: none; }
  .search { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px;
    color: var(--text); outline: none; }
  .search::placeholder { color: var(--hint); }
  .card { background: var(--card); border-radius: 22px; padding: 6px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; width: 100%;
    border: 0; background: none; text-align: left; cursor: pointer; }
  .ava { width: 40px; height: 40px; flex: none; border-radius: 20px; background: var(--pale); color: var(--pale-text);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
  .ava.dish { background: var(--accent); color: var(--on-accent); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .name { font-weight: 700; overflow-wrap: anywhere; }
  .sub { font-size: 14px; color: var(--hint); overflow-wrap: anywhere; }
  .kcal { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .row.own .name { color: var(--accent); }
  .total { margin-top: 12px; background: var(--accent); color: var(--on-accent); border-radius: 22px; padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .total .t1 { font-size: 14px; font-weight: 700; }
  .total .t2 { font-size: 14px; }
  .total .big { font-size: 26px; font-weight: 800; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--card); border-radius: 18px; padding: 12px; display: flex; flex-direction: column;
    gap: 8px; justify-content: space-between; border: 0; text-align: left; cursor: pointer; }
  .tile .name { font-size: 15px; }
  .tile .sub { font-size: 13px; }
  .pill { height: 36px; border: 0; border-radius: 18px; background: var(--pale); color: var(--pale-text);
    font-size: 14px; font-weight: 700; cursor: pointer; }
  .empty { color: var(--hint); padding: 8px 4px; }
  .foot { color: var(--hint); font-size: 13px; margin: 22px 2px 0; }
  .fallback-btn { position: fixed; left: 16px; right: 16px; bottom: 16px; height: 54px; border: 0; border-radius: 27px;
    background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 800; display: none; z-index: 6; }
  .toast { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 9px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 30; }
  .toast.on { opacity: 1; }
  /* Окна — сверху, чтобы клавиатура телефона их не закрывала */
  .shade { position: fixed; inset: 0; background: var(--shade); display: none; z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; top: 0; background: var(--bg); border-radius: 0 0 30px 30px;
    padding: 20px 16px 18px; display: none; z-index: 21; max-height: 100%; overflow-y: auto;
    flex-direction: column; gap: 14px; }
  .sheet.on { display: flex; }
  .shade.on { display: block; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head .ava { width: 48px; height: 48px; border-radius: 24px; font-size: 20px; }
  .head .title { font-size: 21px; font-weight: 800; overflow-wrap: anywhere; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card);
    border-radius: 22px; padding: 8px; }
  .step { width: 52px; height: 52px; flex: none; border: 0; border-radius: 26px; background: var(--pale);
    color: var(--pale-text); font-size: 26px; font-weight: 800; cursor: pointer; }
  .value { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .value .v1 { font-size: 26px; font-weight: 800; }
  .value .v2 { font-size: 15px; font-weight: 700; color: var(--accent); }
  .value input { width: 120px; text-align: center; border: 0; border-bottom: 2px solid var(--accent); background: transparent;
    font: inherit; font-size: 26px; font-weight: 800; color: var(--text); outline: none; padding: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 19px; background: var(--card);
    color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }
  .chip.on { border-color: var(--accent); background: var(--pale); color: var(--pale-text); font-weight: 800; }
  .macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .macros div { background: var(--card); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; }
  .macros span:first-child { font-size: 13px; color: var(--hint); }
  .macros span:last-child { font-size: 17px; font-weight: 800; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .flabel { display: block; color: var(--hint); font-size: 14px; margin: 0 4px; }
  .field input { width: 100%; height: 50px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 17px; outline: none; }
  .field input::placeholder { color: var(--hint); }
  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; height: 54px; border: 0; border-radius: 27px; font-size: 17px; font-weight: 800; cursor: pointer; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .secondary { background: var(--card); color: var(--danger); flex: 0 0 auto !important; padding: 0 22px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Мои блюда */
  .bar { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; }
  .back { width: 44px; height: 44px; flex: none; border: 0; border-radius: 22px; background: var(--card); color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .bar-t { font-size: 22px; font-weight: 800; overflow-wrap: anywhere; min-width: 0; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 20px 2px 10px; }
  .sec h2 { margin: 0; }
  .link { border: 0; background: none; color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer;
    padding: 4px; text-decoration: none; }
  .link.center { align-self: center; }
  .dashed { width: 100%; height: 46px; margin-top: 12px; border: 1.5px dashed var(--accent); border-radius: 23px;
    background: transparent; color: var(--pale-text); font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .card .dashed { width: calc(100% - 24px); margin: 6px 12px 10px; height: 44px; }
  .editor { display: flex; flex-direction: column; gap: 14px; }
  .editor h2 { margin: 6px 2px 0; }
  .hint { font-size: 13px; color: var(--hint); padding: 0 4px; }
  .hint.up { font-size: 14px; margin-top: -8px; }
  .hint.warn { color: var(--danger); }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: var(--card);
    border-radius: 18px; padding: 5px; }
  .seg button { height: 42px; border: 0; border-radius: 14px; background: transparent; color: var(--text);
    font-size: 15px; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 800; }
  .sumline { display: flex; justify-content: space-between; gap: 10px; padding: 8px 16px 10px;
    border-top: 1px solid var(--line); font-weight: 800; }
  .opt { background: var(--card); border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column;
    gap: 10px; border: 2px solid transparent; cursor: pointer; }
  .opt.on { border-color: var(--accent); }
  .ol { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .opt.on .ol { font-weight: 800; }
  .radio { width: 22px; height: 22px; flex: none; border-radius: 11px; border: 2px solid var(--hint);
    display: flex; align-items: center; justify-content: center; }
  .opt.on .radio { border-color: var(--accent); }
  .opt.on .radio::after { content: ""; width: 12px; height: 12px; border-radius: 6px; background: var(--accent); }
  .wline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .winput { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
  .winput input { width: 96px; border: 0; background: transparent; font: inherit; font-size: 26px; font-weight: 800;
    color: var(--text); outline: none; padding: 0; }
  .winput input::placeholder { color: var(--line); }
  .per { font-size: 17px; font-weight: 800; color: var(--accent); }
  .opt:not(.on) .per { color: var(--hint); font-weight: 700; }
  .pn { font-size: 20px; font-weight: 800; min-width: 104px; text-align: center; }
  .mini { width: 40px; height: 40px; flex: none; border: 0; border-radius: 20px; background: var(--pale);
    color: var(--pale-text); font-size: 22px; font-weight: 800; cursor: pointer; }
  .btn-col { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .bigbtn { height: 54px; border: 0; border-radius: 27px; font-size: 17px; font-weight: 800; cursor: pointer; }
  .pale-btn { height: 50px; background: var(--pale); color: var(--pale-text); font-size: 16px; }
  .text-btn { height: 44px; border: 0; background: transparent; color: var(--hint); font-size: 15px; font-weight: 700;
    cursor: pointer; }
  .text-btn.danger { color: var(--danger); }
  .mini-list { background: var(--card); border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column; }
  .mini-list div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .mini-list div:last-child { border-bottom: 0; font-weight: 800; padding: 11px 0 9px; }
  .mini-list b { font-weight: 700; overflow-wrap: anywhere; }
  .mini-list i { font-style: normal; font-weight: 400; color: var(--hint); }
  .mini-list .k { white-space: nowrap; }
  .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .trio .field input { padding: 0 12px; }
  .own-sum { font-size: 16px; font-weight: 800; color: var(--accent); padding: 0 4px; }
  .own-sum:empty { display: none; }
</style>
</head>
<body>
<div id="hdr"><h1>Что вы съели?</h1></div>
<div class="top" id="top">
  <label class="searchbox">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
         aria-hidden="true" style="color: var(--hint)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span class="vh">Найти продукт или своё блюдо</span>
    <input id="q" class="search" type="search" autocomplete="off" enterkeyhint="search"
           placeholder="Найти: гречка, творог, сникерс…">
  </label>
</div>
<div id="view"></div>
<div class="foot" id="foot">
  Данные: USDA FoodData Central; Open Food Facts (лицензия ODbL); блюда и меры — наш нутрициолог.
  Цифры по товарам из магазинов внесены людьми и могут ошибаться.
</div>
<button id="fallbackBtn" class="fallback-btn"></button>
<div id="toast" class="toast" role="status"></div>
<div id="shade" class="shade"></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
// Открыто внутри Telegram? initData тут не годится: при запуске с кнопки клавиатуры он пустой
// (документация Telegram). Вне Telegram platform = "unknown".
const IN_TG = !!(tg && tg.platform && tg.platform !== "unknown");
const NUMS = new URLSearchParams(location.search).get("nums") !== "0";  // человек скрыл калории — не показываем
const DATA_VERSION = "5";
const $ = id => document.getElementById(id);
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));

// ---------- Тема: светлая или тёмная, как в Telegram ----------
function applyTheme() {
  let dark = false;
  if (IN_TG && tg.colorScheme) dark = tg.colorScheme === "dark";
  else { try { dark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {} }
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  if (!IN_TG) return;
  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--bg").trim(), accent = css.getPropertyValue("--accent").trim();
  const onAccent = css.getPropertyValue("--on-accent").trim();
  try { if (ver("6.1")) tg.setBackgroundColor(bg); } catch (e) {}
  try { if (ver("6.1")) tg.setHeaderColor(ver("6.9") ? bg : "bg_color"); } catch (e) {}
  try { if (ver("7.10")) tg.setBottomBarColor(bg); } catch (e) {}
  try { tg.MainButton.setParams({ color: accent, text_color: onAccent }); } catch (e) {}
}
if (tg) { tg.ready(); tg.expand(); try { tg.onEvent("themeChanged", applyTheme); } catch (e) {} }
applyTheme();

// ---------- Слова: так же, как в боте (products.py) ----------
const STOP = new Set(["с", "со", "и", "в", "во", "на", "без", "для", "из", "по"]);
const UNITS = new Set(["г", "гр", "грамм", "грамма", "граммов", "грам", "кг", "мл", "л", "шт", "штук", "штуки"]);
const MINE = new Set(["мой", "моя", "мое", "мои", "моего", "моей"]);   // «моя паста» — ищем блюдо «Паста»
const ENDINGS = new Set(["", "а", "я", "ы", "и", "у", "ю", "е", "о", "ой", "ом", "ей", "ем", "ам", "ами", "ах",
                         "ую", "ая", "ые", "ий", "ие", "их", "ых", "ым", "им", "ыми", "ими", "ого", "его", "ому",
                         "ему", "ое", "ее"]);  // как в боте (products.py)
const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/-/g, "");
const words = s => (norm(s).match(/\d+(?:[.,]\d+)?%|[a-zа-я0-9]+/g) || []).filter(w => !/^\d+$/.test(w));
function same(a, b) {   // одно слово в разных формах: «творога» — «творог», «яйца» — «яйцо»
  if (a.slice(0, 5) === b.slice(0, 5) && Math.abs(a.length - b.length) <= 2) return true;
  if (a.endsWith("%") || b.endsWith("%")) return false;
  for (let n = 3; n <= Math.min(a.length, b.length); n++)
    if (a.slice(0, n) === b.slice(0, n) && ENDINGS.has(a.slice(n)) && ENDINGS.has(b.slice(n))) return true;
  return false;
}
const match = (w, x) => (w.length >= 2 && x.startsWith(w)) || same(w, x);  // «юб» подходит к «юбилейное»
const queryWords = q => words(q).filter(w => !STOP.has(w) && !UNITS.has(w));

// ---------- База ----------
let ALL = [], BY_ID = new Map(), BY_LC = new Map(), offLoaded = false;
// наша база: [id, name, synonyms, kcal, p, f, c, fiber, piece, tbsp, tsp, ml, мерки, порция]
function addBase(rows) {
  for (const r of rows) {
    const variants = [r[1], ...r[2].split(",")].filter(s => s.trim()).map(words);
    add({ id: r[0], name: r[1], brand: "", k: r[3], p: r[4], f: r[5], c: r[6], fb: r[7] || 0, pc: r[8], tb: r[9],
          ts: r[10], ml: r[11], ms: r[12] || [], po: r[13] || 0, tier: 0, variants, keys: variants.flat() });
  }
}
// магазины: [id, name, brand, kcal, p, f, c, piece, слова для поиска, ≈piece, мерки, клетчатка]
function addOff(rows) {
  for (const r of rows) {
    const nameW = words(r[1]);
    add({ id: r[0], name: r[1], brand: r[2], k: r[3], p: r[4], f: r[5], c: r[6], fb: r[11] || 0, pc: r[7], pe: r[9],
          ms: r[10] || [], tier: 1, variants: [nameW], keys: nameW.concat(words(r[8])) });
  }
}
function add(p) {
  ALL.push(p); BY_ID.set(p.id, p);
  if (p.id.startsWith("n:")) BY_LC.set(p.id.toLowerCase(), p);
}
// id нашей базы — «n:название»: регистр букв мог поменяться (нутрициолог поправила) — ищем без него
const getP = id => BY_ID.get(id) || BY_LC.get(String(id).toLowerCase());

function search(q) {
  const qw = queryWords(q);
  if (!qw.length) return [];
  const found = [];
  for (const p of ALL) {
    if (!qw.every(w => p.keys.some(x => match(w, x)))) continue;
    let cover = 0;  // какая доля слов названия совпала: «Печенье Юбилейное» выше «… с хлопьями в корзине»
    for (const v of p.variants) {
      if (!v.length) continue;
      const c = v.filter(x => qw.some(w => match(w, x))).length / v.length;
      if (c > cover) cover = c;
    }
    const first = p.variants.some(v => v.length && match(qw[0], v[0])) ? 0 : 1;  // запрос — начало названия
    const v0 = p.variants[0] || [];   // совпало само название, а не синоним: «Хлеб бородинский» выше «Хлеб ржаной»
    const byName = v0.length ? v0.filter(x => qw.some(w => match(w, x))).length / v0.length : 0;
    found.push([first, p.tier, -cover, -byName, p.name.length, p]);
  }
  found.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2] || a[3] - b[3] || a[4] - b[4]);
  return found.slice(0, 60).map(x => x[5]);
}

// ---------- Единицы: порция, тарелка, штука, ложка, стакан, граммы ----------
const FORMS = {  // 1 / 2–4 / 5+ (дробное — как 2–4: «1,5 тарелки»)
  "порция": ["порция", "порции", "порций"], "тарелка": ["тарелка", "тарелки", "тарелок"],
  "половник": ["половник", "половника", "половников"], "чашка": ["чашка", "чашки", "чашек"],
  "кружка": ["кружка", "кружки", "кружек"], "бокал": ["бокал", "бокала", "бокалов"],
  "рюмка": ["рюмка", "рюмки", "рюмок"], "кусок": ["кусок", "куска", "кусков"],
  "ломтик": ["ломтик", "ломтика", "ломтиков"], "стакан": ["стакан", "стакана", "стаканов"],
};
const numText = n => String(+n.toFixed(2)).replace(".", ",");
const gText = g => g < 10 ? numText(Math.round(g * 10) / 10) : String(Math.round(g));   // «4,5», «75»
const NB = "\u00a0";   // неразрывный пробел: «100 г» не разрывается по строкам
function plural(n, word) {
  const f = FORMS[word];
  if (!f) return `${numText(n)} ${word}`;
  if (n !== Math.floor(n)) return `${numText(n)} ${f[1]}`;
  const k = n % 100, d = n % 10;
  return `${numText(n)} ${k >= 11 && k <= 14 ? f[2] : d === 1 ? f[0] : d >= 2 && d <= 4 ? f[1] : f[2]}`;
}
function unitsOf(p) {   // какие единицы есть у продукта: {key, word, grams, hint}
  const u = [];
  const ms = p.ms || [];
  // порция = тарелка (350 мл у супа) — вторая кнопка с тем же весом не нужна

// ---------- Мои блюда: хранятся в Telegram (CloudStorage) — свои у каждого человека, на всех его устройствах ----------
// Ключи: «dishes» — порядок (недавние первыми), «dish_<id>» — одно блюдо. Лимиты Telegram: 1024 ключа,

function csCall(fn, timeout = 2500) {   // вызов CloudStorage → Promise; не дольше timeout

    try {
      fn((err, val) => { if (done) return; done = true; clearTimeout(t); err ? reject(err) : resolve(val); });
    } catch (e) { if (!done) { done = true; clearTimeout(t); reject(e); } }

      const vals = await Promise.all(parts.map(p => csCall(cb => tg.CloudStorage.getItems(p, cb), 5000)));

// ---------- Экраны: main — запись еды; editor — блюдо; pick — поиск продукта для блюда ----------

view.addEventListener("click", e => {
  if (scr === "editor") { editorClick(e); return; }
  const el = e.target.closest("[data-add],[data-dadd],[data-pick],[data-own],[data-edit],[data-recent],[data-dish]," +
                              "[data-savemeal],[data-newdish],[data-alldishes]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.add) quickAdd(+ds.add);
  else if (ds.dadd) quickDish(dishById(ds.dadd));
  else if (ds.pick) openPortion(getP(ds.pick));
  else if (ds.own) { noteMiss(q.value.trim()); openOwn(q.value.trim()); }
  else if (ds.dish) openDish(dishById(ds.dish));
  else if (ds.edit) {
    const i = +ds.edit, it = items[i];
    if (it.own) openOwn(it.name, it, i);
    else if (it.dish) openDish(dishById(it.dish), it, i);
    else openPortion(getP(it.id), it, i);
  } else if (ds.recent) {
    const r = recentShown()[+ds.recent];
    r[0] === "own" ? openOwn(r[1], ownFromArr(r)) : openPortion(getP(r[0]), { g: r[1], label: r[2], unit: r[3], n: r[4] });
  } else if (ds.savemeal) openSaveMeal();
  else if (ds.newdish) openEditor(null);
  else if (ds.alldishes) { allDishes = !allDishes; render(); }
});
hdr.addEventListener("click", e => { if (e.target.closest("[data-back]")) goBack(); });

const recentShown = () => recent.filter(r => r[0] === "own" || getP(r[0])).slice(0, 8);
function quickAdd(i) {
  const r = recentShown()[i];
  if (r[0] === "own") items.push(ownFromArr(r));
  else items.push({ id: r[0], g: r[1], label: r[2] || "", unit: r[3], n: r[4] });
  toast(`Добавлено: ${r[0] === "own" ? r[1] : getP(r[0]).name}`);
  render();
}
function quickDish(d) {   // «Добавить» на плитке: порционное — сразу 1 порция, кастрюля по весу — спросим граммы
  if (!d) return;
  if (dishUnit(d).byWeight) { openDish(d); return; }
  items.push({ dish: d.id, n: 1, label: plural(1, "порция") });
  toast(`Добавлено: ${d.name}`);
  render();
}

let timer = null;
q.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    render();
    const t = q.value.trim();
    if (t.length >= 3 && offLoaded && !lastCount) noteMiss(t);
  }, 120);
});

function noteMiss(t) {
  t = norm(t).slice(0, 40);
  if (!t) return;
  misses = misses.filter(m => !t.startsWith(m) && !m.startsWith(t));  // «борщ» вместо «бор», «борщ»
  misses.push(t);
  misses = misses.slice(-5);
}

// ---------- «Назад» и кнопка «Записать» ----------
const sheet = $("sheet"), shade = $("shade");
const sheetOn = () => sheet.classList.contains("on");
function syncChrome() {
  if (IN_TG) { try { sheetOn() || scr !== "main" ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
  updateButton();
}
function goBack() {
  if (sheetOn()) { closeSheet(); return; }
  if (scr === "pick") { scr = "editor"; q.value = ""; render(); return; }
  if (scr === "editor") leaveEditor();
}
if (IN_TG) { try { tg.BackButton.onClick(goBack); } catch (e) {} }

function showSheet(html) {
  sheet.innerHTML = html;
  sheet.scrollTop = 0;
  sheet.classList.add("on"); shade.classList.add("on");
  syncChrome();
}
function closeSheet() {
  sheet.classList.remove("on"); shade.classList.remove("on");
  sheet.innerHTML = "";
  syncChrome();
}
shade.addEventListener("click", closeSheet);

// после «Добавить» в окне: в приём (главный экран) или в состав блюда (редактор)
function placeItem(it, editIndex, name) {
  const list = inDish() ? ed.items : items;
  if (editIndex !== undefined) list[editIndex] = it;
  else list.push(it);
  closeSheet();
  if (inDish()) { ed.dirty = true; if (scr === "pick") scr = "editor"; }
  if (editIndex === undefined) { q.value = ""; toast(`${inDish() ? "В блюдо" : "Добавлено"}: ${name}`); }
  render();
}
function removeItem(editIndex) {
  (inDish() ? ed.items : items).splice(editIndex, 1);
  if (inDish()) ed.dirty = true;
  closeSheet(); render();
}
const snap = p => ({ name: p.name, k: p.k, p: p.p, f: p.f, c: p.c, fb: p.fb || 0 });   // копия цифр для состава блюда

// ---------- Окно порции продукта ----------
function openPortion(p, prev, editIndex) {
  if (!p) return;
  const units = unitsOf(p);
  // единица и количество: как было в записи, иначе порция → штука → 100 г
  let u = units.find(x => prev && x.key === prev.unit) || (prev ? units[units.length - 1] : units[0]);
  let n = prev ? (u.key === "г" ? prev.g : (prev.n || 1)) : (u.key === "г" ? 100 : 1);
  const editing = editIndex !== undefined;
  const chips = units.map((x, i) =>
    `<button class="chip" data-u="${i}">${esc(x.key === "г" ? "граммы" : x.key)}${x.hint ? ` · ${esc(x.hint)}` : ""}</button>`).join("");
  showSheet(`
    <div class="head"><span class="ava" aria-hidden="true">${esc(letter(p.name))}</span>
      <span class="main"><span class="title">${esc(p.name)}</span>
      <span class="sub">${esc([p.brand, per100(p)].filter(Boolean).join(" · "))}</span></span></div>
    <div class="stepper">
      <button class="step" id="minus" aria-label="Меньше">−</button>
      <div class="value" id="value"></div>
      <button class="step" id="plus" aria-label="Больше">+</button>
    </div>
    <div class="chips">${chips}</div>
    ${NUMS ? `<div class="macros" id="macros"></div>` : ""}
    <div class="actions">
      ${editing ? `<button class="secondary" id="del">Убрать</button>` : ""}
      <button class="primary" id="ok">${editing ? "Сохранить" : inDish() ? "Добавить в блюдо" : "Добавить в приём"}</button>
    </div>`);
  const grams = () => u.key === "г" ? n : n * u.grams;
  const paint = (keepInput) => {
    const g = grams(), kc = Math.round(p.k * g / 100);
    const v = $("value");
    if (u.key === "г") {
      if (!keepInput) {
        v.innerHTML = `<label class="vh" for="gr">Граммы</label><input id="gr" type="number" inputmode="decimal" min="1" max="5000">` +
                      `<span class="v2" id="v2"></span>`;
        $("gr").value = Math.round(n);
        $("gr").addEventListener("input", e => {
          const x = parseFloat(e.target.value.replace(",", "."));
          if (x > 0) { n = x; paint(true); }
        });
      }
      $("v2").textContent = NUMS ? `${kc} ккал` : "граммов";
    } else {
      v.innerHTML = `<span class="v1">${esc(unitLabel(u, n))}</span>` +
                    `<span class="v2">${gText(g)} г${NUMS ? ` · ${kc} ккал` : ""}</span>`;
    }
    sheet.querySelectorAll(".chip").forEach((c, i) => c.classList.toggle("on", units[i] === u));
    if (NUMS) {
      const [pp, ff, cc] = [p.p, p.f, p.c].map(x => Math.round(x * g / 100 * 10) / 10);
      $("macros").innerHTML = `<div><span>Белки</span><span>${numText(pp)} г</span></div>` +
        `<div><span>Жиры</span><span>${numText(ff)} г</span></div><div><span>Углеводы</span><span>${numText(cc)} г</span></div>`;
    }
  };
  paint();
  const stepTo = dir => {
    if (u.key === "г") n = Math.max(5, Math.round((n + dir * 10) / 5) * 5);
    else n = stepCount(n, dir);
    paint();
  };
  $("minus").addEventListener("click", () => stepTo(-1));
  $("plus").addEventListener("click", () => stepTo(1));
  sheet.querySelector(".chips").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const nu = units[+c.dataset.u];
    if (nu === u) return;
    n = nu.key === "г" ? Math.round(grams()) : 1;
    u = nu; paint();
  });
  $("ok").addEventListener("click", () => {
    const g = grams();
    if (!(g > 0 && g <= 5000)) { toast("Введите граммы"); return; }
    const it = { id: p.id, g: Math.round(g * 10) / 10, label: unitLabel(u, n), unit: u.key, n };
    if (inDish()) Object.assign(it, snap(p));
    placeItem(it, editIndex, p.name);
  });
  if ($("del")) $("del").addEventListener("click", () => removeItem(editIndex));
}

// ---------- Своё: название, калории и (по желанию) БЖУ — на 100 г или на всю порцию ----------
const fmtNum = v => v === null || v === undefined ? "" : numText(v);
const capFirst = t => t ? t[0].toUpperCase() + t.slice(1) : t;   // названия — с большой буквы, как в базе
function openOwn(name, prev, editIndex) {
  const editing = editIndex !== undefined, forDish = inDish();
  let m = prev ? (prev.m || "all") : (ls.get("ownMode") === "all" ? "all" : "100");   // как в прошлый раз
  const e = prev ? (prev.e || [prev.kcal || 0, null, null, null]) : [null, null, null, null];
  const field = (id, label, ph) => `<div class="field"><label for="${id}">${label}</label>` +
    `<input id="${id}" type="text" inputmode="decimal" autocomplete="off"${ph ? ` placeholder="${ph}"` : ""}></div>`;
  showSheet(`
    <div class="head"><span class="ava" aria-hidden="true">${ICON.pencil}</span>
      <span class="main"><span class="title">${forDish ? "Свой продукт" : "Своё блюдо или продукт"}</span>
      <span class="sub">Например, готовая еда с КБЖУ на этикетке</span></span></div>
    <div class="field"><label for="ownName">Название</label><input id="ownName" maxlength="60" autocomplete="off"></div>
    ${NUMS ? `
    <div class="field"><span class="flabel">КБЖУ указаны</span>
      <div class="seg" id="ownSeg"><button data-m="100">На 100 г</button><button data-m="all">На всю порцию</button></div>
      <span class="hint" id="ownHint"></span></div>
    <div id="ownGBox">${field("ownG", forDish ? "Сколько граммов положили" : "Сколько граммов съели", "например, 150")}</div>
    ${field("ownK", "Калории")}
    <div class="trio">${field("ownP", "Белки")}${field("ownF", "Жиры")}${field("ownC", "Углеводы")}</div>
    <span class="hint">Белки, жиры и углеводы можно не заполнять — тогда в сумме БЖУ этой еды не будет.</span>
    <div class="own-sum" id="ownSum"></div>
    <span class="hint warn" id="ownWarn"></span>` : ""}
    <div class="actions">
      ${editing ? `<button class="secondary" id="del">Убрать</button>` : ""}
      <button class="primary" id="ok">${editing ? "Сохранить" : forDish ? "Добавить в блюдо" : "Добавить в приём"}</button>
    </div>`);
  $("ownName").value = capFirst(name || "");
  const val = id => {   // пусто → null, не число → NaN; запятая или точка — всё равно
    const t = $(id).value.trim().replace(",", ".");
    if (!t) return null;
    const x = Number(t);
    return isFinite(x) ? x : NaN;
  };
  const paint = () => {
    if (!NUMS) return;
    sheet.querySelectorAll("#ownSeg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    $("ownHint").textContent = m === "100" ? "Как на этикетке: на 100 г продукта"
      : forDish ? "На всё, что положили в блюдо" : "На всё, что съели: например, вся упаковка";
    $("ownGBox").style.display = m === "100" ? "" : "none";
    const k = val("ownK"), p = val("ownP"), f = val("ownF"), c = val("ownC"), g = val("ownG");
    let sum = "";
    if (m === "100" && g > 0 && k >= 0) {
      const x = g / 100, bju = [p, f, c].some(v => v > 0)
        ? ` · Б ${numText(r1((p || 0) * x))} · Ж ${numText(r1((f || 0) * x))} · У ${numText(r1((c || 0) * x))} г` : "";
      sum = `= ${Math.round(k * x)} ккал${bju}`;
    }
    $("ownSum").textContent = sum;
    // кДж вместо ккал или опечатка: по БЖУ калорий выходит совсем другое число (4 ккал на 1 г Б и У, 9 — на 1 г Ж)
    let warn = "";
    if (m === "100" && k > 900) warn = "Больше 900 ккал на 100 г почти не бывает — возможно, это кДж. Нужны ккал.";
    else if (k > 0 && p !== null && f !== null && c !== null && p >= 0 && f >= 0 && c >= 0) {
      const est = 4 * p + 9 * f + 4 * c;
      if (Math.abs(est - k) > Math.max(30, 0.4 * k)) warn = `Проверьте: по белкам, жирам и углеводам выходит около ${Math.round(est)} ккал.`;
    }
    $("ownWarn").textContent = warn;
  };
  if (NUMS) {
    $("ownK").value = fmtNum(e[0]); $("ownP").value = fmtNum(e[1]); $("ownF").value = fmtNum(e[2]); $("ownC").value = fmtNum(e[3]);
    $("ownG").value = prev && prev.m === "100" ? fmtNum(prev.g) : "";
    $("ownSeg").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { m = b.dataset.m; paint(); } });
    ["ownG", "ownK", "ownP", "ownF", "ownC"].forEach(id => $(id).addEventListener("input", paint));
    paint();
  }
  (!name ? $("ownName") : !NUMS ? $("ownName") : m === "100" && !$("ownG").value ? $("ownG") : $("ownK")).focus();
  $("ok").addEventListener("click", () => {
    const nm = capFirst($("ownName").value.trim());
    if (!nm) { toast("Напишите название"); return; }
    if (!NUMS) { placeItem(ownItem(nm, "all", 0, [0, null, null, null]), editIndex, nm); return; }
    const per100 = m === "100", k = val("ownK"), g = val("ownG");
    const bju = [val("ownP"), val("ownF"), val("ownC")];
    if (per100 && !(g > 0 && g <= 5000)) { toast(forDish ? "Сколько граммов положили?" : "Сколько граммов съели?"); $("ownG").focus(); return; }
    if (k === null || !(k >= 0)) { toast("Впишите калории"); $("ownK").focus(); return; }
    if (per100 && k > 950) { toast("Больше 900 ккал на 100 г не бывает — возможно, это кДж. Нужны ккал", 3000); return; }
    if (!per100 && k > 5000) { toast("Больше 5000 ккал — проверьте число"); return; }
    if (bju.some(x => x !== null && !(x >= 0 && x <= (per100 ? 100 : 1000)))) {
      toast(per100 ? "Белки, жиры, углеводы — от 0 до 100 г на 100 г" : "Проверьте белки, жиры и углеводы"); return;
    }
    ls.set("ownMode", m);
    placeItem(ownItem(nm, m, per100 ? r1(g) : 0, [r1(k), ...bju.map(x => x === null ? null : r1(x))]), editIndex, nm);
  });
  if ($("del")) $("del").addEventListener("click", () => removeItem(editIndex));
}

// ---------- Окно моего блюда: сколько граммов (кастрюля по весу) или порций ----------
function openDish(d, prev, editIndex) {
  if (!d) return;
  const u = dishUnit(d), editing = editIndex !== undefined, forDish = inDish();
  let n = prev ? (u.byWeight ? (prev.g || 300) : (prev.n || 1)) : (u.byWeight ? 300 : 1);
  let typing = false;   // «граммы» — вписать свой вес
  const k = Math.round(u.per.k);
  const sub = !NUMS ? "моё блюдо" : u.byWeight ? `моё блюдо · ${k}${NB}ккал / 100${NB}г готового`
            : d.type === "pot" ? `моё блюдо · ${k} ккал в порции` : `моё блюдо · ${k} ккал за порцию`;
  showSheet(`
    <div class="head"><span class="ava dish" aria-hidden="true">${ICON.pot}</span>
      <span class="main"><span class="title">${esc(d.name)}</span><span class="sub">${esc(sub)}</span></span></div>
    <div class="stepper">
      <button class="step" id="minus" aria-label="${u.byWeight ? "Меньше на 10 г" : "Меньше"}">−</button>
      <div class="value" id="value"></div>
      <button class="step" id="plus" aria-label="${u.byWeight ? "Больше на 10 г" : "Больше"}">+</button>
    </div>
    ${u.byWeight ? `<div class="hint" style="font-size:14px">Взвесьте свою тарелку — или выберите примерно:</div>
      <div class="chips">${[200, 250, 300, 400].map(g => `<button class="chip" data-g="${g}">${g} г</button>`).join("")}
      <button class="chip" data-g="0">граммы</button></div>` : ""}
    ${NUMS ? `<div class="macros" id="macros"></div>` : ""}
    <div class="actions">
      ${editing ? `<button class="secondary" id="del">Убрать</button>` : ""}
      <button class="primary" id="ok">${editing ? "Сохранить" : forDish ? "Добавить в блюдо" : "Добавить в приём"}</button>
    </div>
    ${forDish ? "" : `<button class="link center" id="editDish">Изменить блюдо</button>`}`);
  const totals = () => u.byWeight ? scale(u.per, n / 100) : scale(u.per, n);
  const paint = keepInput => {
    const t = totals(), v = $("value"), kc = NUMS ? `${Math.round(t.k)} ккал` : "";
    if (u.byWeight && typing) {
      if (!keepInput) {
        v.innerHTML = `<label class="vh" for="gr">Граммы</label><input id="gr" type="number" inputmode="decimal" min="1" max="5000">` +
                      `<span class="v2" id="v2"></span>`;
        $("gr").value = Math.round(n);
        $("gr").addEventListener("input", e => {
          const x = parseFloat(e.target.value.replace(",", "."));
          if (x > 0) { n = x; paint(true); }
        });
      }
      $("v2").textContent = kc || "граммов";
    } else {
      v.innerHTML = `<span class="v1">${u.byWeight ? `${Math.round(n)} г` : esc(plural(n, "порция"))}</span>` +
                    (kc ? `<span class="v2">${kc}</span>` : "");
    }
    sheet.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", typing ? c.dataset.g === "0" : +c.dataset.g === n));
    if (NUMS) {
      $("macros").innerHTML = `<div><span>Белки</span><span>${numText(r1(t.p))} г</span></div>` +
        `<div><span>Жиры</span><span>${numText(r1(t.f))} г</span></div><div><span>Углеводы</span><span>${numText(r1(t.c))} г</span></div>`;
    }
  };
  paint();
  const stepTo = dir => {
    if (u.byWeight) { typing = false; n = Math.max(10, Math.round(n / 10) * 10 + dir * 10); }
    else n = stepCount(n, dir);
    paint();
  };
  $("minus").addEventListener("click", () => stepTo(-1));
  $("plus").addEventListener("click", () => stepTo(1));
  if (u.byWeight) sheet.querySelector(".chips").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const g = +c.dataset.g;
    if (g) { typing = false; n = g; paint(); }
    else { typing = true; paint(); $("gr").focus(); $("gr").select(); }
  });
  $("ok").addEventListener("click", () => {
    if (u.byWeight && !(n > 0 && n <= 5000)) { toast("Введите граммы"); return; }
    const g = Math.round(n);
    const it = u.byWeight ? { dish: d.id, g, n: g, label: "" } : { dish: d.id, n, label: plural(n, "порция") };
    if (forDish) {   // моё блюдо внутри другого блюда — запоминаем цифры как есть
      const t = dishItemTotals(it);
      placeItem({ fix: true, name: d.name, label: u.byWeight ? `${g} г` : it.label, kcal: r1(t.k), p: r1(t.p), f: r1(t.f),
                  c: r1(t.c), fb: r1(t.fb), g: u.byWeight ? g : 0 }, editIndex, d.name);
    } else placeItem(it, editIndex, d.name);
  });
  if ($("del")) $("del").addEventListener("click", () => removeItem(editIndex));
  if ($("editDish")) $("editDish").addEventListener("click", () => openEditor(d));
}

// моё блюдо в составе другого блюда: цифры сохранены как есть — можно только убрать
function openFix(i) {
  const it = ed.items[i];
  showSheet(`
    <div class="head"><span class="ava dish" aria-hidden="true">${ICON.pot}</span>
      <span class="main"><span class="title">${esc(it.name)}</span>
      <span class="sub">${esc(`моё блюдо · ${it.label}` + (NUMS ? ` · ${Math.round(it.kcal)} ккал` : ""))}</span></span></div>
    <div class="hint" style="font-size:14px">Это готовое блюдо в составе. Чтобы поменять количество — уберите его и добавьте заново.</div>
    <div class="actions"><button class="secondary" id="del">Убрать</button><button class="primary" id="ok">Готово</button></div>`);
  $("del").addEventListener("click", () => removeItem(i));
  $("ok").addEventListener("click", closeSheet);
}

// ---------- Редактор блюда ----------
function openEditor(d, preset) {
  ed = d ? { id: d.id, name: d.name, type: d.type, mode: d.mode, cooked: d.cooked || "", portions: d.portions || 4,
             items: d.items.map(x => Object.assign({}, x)), dirty: false }
         : { id: null, name: "", type: "pot", mode: "weight", cooked: "", portions: 4, items: [], dirty: false };
  Object.assign(ed, preset || {});
  if (sheetOn()) closeSheet();
  scr = "editor"; q.value = ""; leaveArmed = 0; delArmed = 0;
  render();
  window.scrollTo(0, 0);
}
function ingRow(it, i) {
  const kcal = NUMS ? `${Math.round(ingTotals(it).k)} ккал` : "", data = `data-ing="${i}"`;
  if (it.own) return row({ name: it.name, sub: ownSub(it), kcal, data, ava: ICON.pencil });
  if (it.fix) return row({ name: it.name, sub: `моё блюдо · ${it.label}`, kcal, data, ava: ICON.pot, avaCls: "dish" });
  return row({ name: nameOf(it), sub: amountText(it.g, it.label), kcal, data });
}
function renderEditor() {
  setHeader();
  const pot = ed.type === "pot", t = sumT(ed.items, ingTotals);
  let h = `<div class="editor">
    <div class="field"><label for="dName">Название</label>
      <input id="dName" maxlength="50" autocomplete="off" placeholder="${pot ? "Например: Паста с курицей" : "Например: Омлет с сыром"}"></div>
    <div class="field"><span class="flabel">Это блюдо</span>
      <div class="seg"><button data-type="one" class="${pot ? "" : "on"}">Одна порция</button>` +
      `<button data-type="pot" class="${pot ? "on" : ""}">Кастрюля</button></div>
      <span class="hint">${pot ? "Кастрюля — готовите сразу много и едите несколько раз" : "Одна порция — собираете каждый раз одинаково"}</span></div>
    <h2>${pot ? "Что положили" : "Из чего порция"}</h2>
    ${pot ? `<div class="hint up">Сырым или сухим весом: макароны и крупы — сухими, мясо — сырым</div>` : ""}
    <div class="card">${ed.items.map(ingRow).join("")}
      <button class="dashed" id="addIng">＋ Добавить продукт</button>
      ${pot && NUMS && ed.items.length ? `<div class="sumline"><span>Вся кастрюля</span><span>${Math.round(t.k)} ккал</span></div>` : ""}
    </div>`;
  if (!pot && NUMS && ed.items.length) {
    const [p, f, c] = macros(ed.items, ingTotals);
    h += `<div class="total" style="margin-top:0"><span><span class="t1">Вся порция</span><br><span class="t2">Б ${p} · Ж ${f} · У ${c} г</span></span>` +
         `<span class="big">${Math.round(t.k)} ккал</span></div>`;
  }
  if (pot) h += `
    <h2>Сколько получилось</h2>
    <div class="opt" data-mode="weight">
      <span class="ol"><span class="radio"></span>Взвешу готовое блюдо</span>
      <div class="wline"><span class="winput"><label class="vh" for="cw">Вес готового блюда, г</label>
        <input id="cw" type="number" inputmode="numeric" min="1" max="30000" placeholder="0"><span class="sub">г</span></span>
        <span class="per" id="perW"></span></div>
      <span class="hint" id="cwHint"></span>
    </div>
    <div class="opt" data-mode="portions">
      <span class="ol"><span class="radio"></span>Нет весов — разделю на порции</span>
      <div class="wline"><button class="mini" data-pstep="-1" aria-label="Меньше порций">−</button><span class="pn" id="pN"></span>` +
      `<button class="mini" data-pstep="1" aria-label="Больше порций">+</button><span class="per" id="perP"></span></div>
    </div>`;
  h += `<div class="btn-col">
      <button class="bigbtn primary" id="saveAdd">Сохранить и добавить в приём</button>
      <button class="bigbtn pale-btn" id="saveOnly">Только сохранить</button>
      ${ed.id ? `<button class="text-btn danger" id="delDish">Удалить блюдо</button>` : ""}
    </div></div>`;
  view.innerHTML = h;
  $("dName").value = ed.name;
  $("dName").addEventListener("input", e => { ed.name = e.target.value; ed.dirty = true; });
  if (pot) {
    $("cw").value = ed.cooked || "";
    $("cw").addEventListener("input", e => { ed.cooked = e.target.value; ed.dirty = true; ed.mode = "weight"; paintModes(); });
    paintModes();
  }
}
const numOf = s => parseFloat(String(s || "").replace(",", "."));
function paintModes() {
  view.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.dataset.mode === ed.mode));
  const t = sumT(ed.items, ingTotals), w = numOf(ed.cooked);
  const raw = sumT(ed.items, ingTotals).g;
  $("perW").textContent = NUMS && w >= 10 && t.k ? `= ${Math.round(t.k * 100 / w)} ккал на 100 г` : "";
  const odd = w > 0 && raw > 0 && (w < raw * 0.4 || w > raw * 6);   // 1,65 вместо 1650 или лишний ноль
  $("cwHint").textContent = odd ? `Проверьте вес: продукты вместе весят ${Math.round(raw)} г. Вес — в граммах.`
                                : "Кастрюля с едой минус пустая кастрюля";
  $("cwHint").classList.toggle("warn", odd);
  $("pN").textContent = plural(ed.portions, "порция");
  $("perP").textContent = NUMS && t.k ? `= ${Math.round(t.k / ed.portions)} ккал в порции` : "";
}
function editorClick(e) {
  const el = e.target.closest("[data-ing],[data-type],[data-pstep],[data-mode],#addIng,#saveAdd,#saveOnly,#delDish");
  if (!el) return;
  const ds = el.dataset;
  if (ds.ing !== undefined) {
    const i = +ds.ing, it = ed.items[i];
    if (it.own) openOwn(it.name, it, i);
    else if (it.fix) openFix(i);
    else openPortion(getP(it.id) || Object.assign({ id: it.id, brand: "" }, snap(it)), it, i);
  } else if (ds.type) {
    if (ds.type !== ed.type) { ed.type = ds.type; ed.dirty = true; renderEditor(); }
  } else if (ds.pstep) {
    ed.portions = Math.min(50, Math.max(1, ed.portions + +ds.pstep));
    ed.mode = "portions"; ed.dirty = true; paintModes();
  } else if (ds.mode) {
    if (ed.mode !== ds.mode) { ed.mode = ds.mode; ed.dirty = true; paintModes(); }
    if (ds.mode === "weight" && e.target.id !== "cw") $("cw").focus();
  } else if (el.id === "addIng") {
    if (ed.items.length >= 40) { toast("Больше 40 продуктов не поместится — разделите на два блюда"); return; }
    scr = "pick"; q.value = ""; render(); window.scrollTo(0, 0); q.focus();
  } else if (el.id === "saveAdd") saveEditor(true);
  else if (el.id === "saveOnly") saveEditor(false);
  else if (el.id === "delDish") deleteDish(el);
}
let leaveArmed = 0, delArmed = 0, saving = false;
function leaveEditor() {
  if (ed && ed.dirty && Date.now() - leaveArmed > 3000) {
    leaveArmed = Date.now();
    toast("Блюдо не сохранено. Нажмите «назад» ещё раз, чтобы выйти без сохранения", 3000);
    return;
  }
  scr = "main"; ed = null; q.value = ""; render();
}
async function saveEditor(addToMeal) {
  if (saving) return;
  const name = ed.name.trim().replace(/\s+/g, " ");
  const pot = ed.type === "pot", w = numOf(ed.cooked);
  if (!name) { toast("Напишите название"); $("dName").focus(); return; }
  if (dishes.some(x => x.id !== ed.id && norm(x.name) === norm(name))) { toast(`Блюдо «${name}» уже есть — назовите иначе`); return; }
  if (!ed.items.length) { toast("Добавьте хотя бы один продукт"); return; }
  if (pot && ed.mode === "weight" && !(w >= 10 && w <= 30000)) {
    toast("Впишите вес готового блюда в граммах — или выберите «Нет весов»", 3000); $("cw").focus(); return;
  }
  if (!ed.id && dishes.length >= MAX_DISHES) { toast(`Больше ${MAX_DISHES} блюд не поместится — удалите ненужные`); return; }
  const old = ed.id ? dishById(ed.id) : null;
  const d = { id: ed.id || newId(), name, type: ed.type, mode: pot ? ed.mode : "portions",
              cooked: pot && ed.mode === "weight" ? Math.round(w) : 0, portions: ed.portions,
              items: ed.items, created: old ? old.created : Date.now() };
  const value = packDish(d);
  if (value.length > 4000) { toast("Слишком длинный состав — разделите на два блюда"); return; }
  saving = true;
  ["saveAdd", "saveOnly"].forEach(id => { if ($(id)) $(id).disabled = true; });
  dishes = [d].concat(dishes.filter(x => x.id !== d.id));   // свежее — первым
  if (old && dishUnit(old).byWeight !== dishUnit(d).byWeight) {   // было по весу, стало по порциям (или наоборот)
    const before = items.length;
    items = items.filter(it => it.dish !== d.id);
    if (items.length < before) toast(`«${name}» убрано из приёма — добавьте заново`, 2500);
  }
  const inCloud = await storeSet("dish_" + d.id, value);
  await saveOrder();
  saving = false;
  scr = "main"; ed = null; q.value = "";
  render();
  window.scrollTo(0, 0);
  if (!inCloud) toast("Сохранено только на этом устройстве: Telegram не ответил. Откройте ещё раз и сохраните снова", 3500);
  if (addToMeal) {
    if (d.type === "pot") { openDish(d); if (inCloud) toast(`Сохранено: ${name}. Сколько положили себе?`, 2500); }   // кастрюля — спросим граммы или порции
    else { items.push({ dish: d.id, n: 1, label: plural(1, "порция") }); render(); if (inCloud) toast(`Сохранено и добавлено: ${name}`); }
  } else if (inCloud) toast(`Сохранено в «Мои блюда»: ${name}`);
}
async function deleteDish(btn) {
  if (Date.now() - delArmed > 3000) {   // без окон браузера: второе нажатие подтверждает
    delArmed = Date.now();
    btn.textContent = "Точно удалить? Нажмите ещё раз";
    setTimeout(() => { if (btn.isConnected && Date.now() - delArmed >= 3000) btn.textContent = "Удалить блюдо"; }, 3100);
    return;
  }
  const id = ed.id, name = ed.name;
  dishes = dishes.filter(x => x.id !== id);
  items = items.filter(it => it.dish !== id);
  await storeDel("dish_" + id);
  await saveOrder();
  scr = "main"; ed = null; q.value = ""; render();
  toast(`Удалено: ${name}. Записи в дневнике остались`, 2500);
}

// ---------- «Сохранить этот приём как блюдо» ----------
function toIng(it) {   // строка приёма → строка состава блюда
  if (it.own) return ownFromArr(ownToArr(it));   // копия
  if (it.dish) {
    const d = dishById(it.dish), t = dishItemTotals(it), w = d && dishUnit(d).byWeight;
    return { fix: true, name: nameOf(it), label: w ? `${Math.round(it.g)} г` : it.label, kcal: r1(t.k), p: r1(t.p), f: r1(t.f),
             c: r1(t.c), fb: r1(t.fb), g: w ? Math.round(it.g) : 0 };
  }
  return Object.assign({ id: it.id, g: it.g, label: it.label, unit: it.unit, n: it.n }, snap(getP(it.id) || it));
}
function openSaveMeal() {
  let type = "one";
  const lines = items.map(it => {
    const amt = it.own ? (it.m === "100" ? `${gText(it.g)}${NB}г` : "") : it.dish ? (dishById(it.dish) && dishUnit(dishById(it.dish)).byWeight ? `${Math.round(it.g)} г` : it.label)
                                       : (it.label || `${Math.round(it.g)} г`);
    return `<div><b>${esc(nameOf(it))}${amt ? ` <i>· ${esc(amt)}</i>` : ""}</b>${NUMS ? `<span class="k">${kcalOf(it)} ккал</span>` : ""}</div>`;
  }).join("");
  showSheet(`
    <div class="head"><span class="ava" aria-hidden="true">${ICON.star}</span>
      <span class="main"><span class="title">Сохранить как блюдо</span><span class="sub">В следующий раз — одним нажатием</span></span></div>
    <div class="field"><label for="smName">Название</label><input id="smName" maxlength="50" autocomplete="off" placeholder="Например: Мой завтрак"></div>
    <div class="field"><span class="flabel">Это блюдо</span>
      <div class="seg" id="smSeg"><button data-t="one">Одна порция</button><button data-t="pot">Кастрюля</button></div>
      <span class="hint" id="smHint"></span></div>
    <div class="mini-list">${lines}<div><span id="smTotalT"></span>${NUMS ? `<span class="k" style="color:var(--accent)">${total()} ккал</span>` : ""}</div></div>
    <button class="bigbtn primary" id="smOk"></button>
    <button class="text-btn" id="smCancel">Отмена</button>`);
  const paint = () => {
    sheet.querySelectorAll("#smSeg button").forEach(b => b.classList.toggle("on", b.dataset.t === type));
    $("smHint").textContent = type === "pot" ? "Кастрюля — дальше впишете вес готового блюда или число порций"
                                              : "Одна порция — всё это вместе, как сейчас";
    $("smTotalT").textContent = type === "pot" ? "Всё вместе" : "Вся порция";
    $("smOk").textContent = type === "pot" ? "Дальше: сколько получилось" : "Сохранить блюдо";
  };
  paint();
  $("smSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { type = b.dataset.t; paint(); } });
  $("smCancel").addEventListener("click", closeSheet);
  $("smOk").addEventListener("click", async () => {
    if (saving) return;
    const name = $("smName").value.trim().replace(/\s+/g, " ");
    if (!name) { toast("Напишите название"); $("smName").focus(); return; }
    if (dishes.some(x => norm(x.name) === norm(name))) { toast(`Блюдо «${name}» уже есть — назовите иначе`); return; }
    if (items.length > 40) { toast("Больше 40 продуктов в блюде не поместится"); return; }
    if (type === "pot") { openEditor(null, { name, type: "pot", items: items.map(toIng), dirty: true }); return; }
    if (dishes.length >= MAX_DISHES) { toast(`Больше ${MAX_DISHES} блюд не поместится — удалите ненужные`); return; }
    const d = { id: newId(), name, type: "one", mode: "portions", cooked: 0, portions: 1, items: items.map(toIng), created: Date.now() };
    const value = packDish(d);
    if (value.length > 4000) { toast("Слишком длинный состав — разделите на два блюда"); return; }
    saving = true; $("smOk").disabled = true;
    dishes = [d].concat(dishes);
    const inCloud = await storeSet("dish_" + d.id, value);
    await saveOrder();
    saving = false;
    closeSheet(); render();
    toast(inCloud ? `Сохранено в «Мои блюда»: ${name}` : "Сохранено только на этом устройстве: Telegram не ответил", 2500);
  });
}

// ---------- Кнопка «Записать» (кнопка самого Telegram, внизу) ----------
function updateButton() {
  const text = NUMS ? `Записать · ${total()} ккал` : "Записать";
  const show = scr === "main" && items.length > 0 && !sheetOn();
  if (IN_TG) {
    tg.MainButton.setText(text);
    show ? tg.MainButton.show() : tg.MainButton.hide();
  } else {
    const b = $("fallbackBtn"); b.textContent = text; b.style.display = show ? "block" : "none";
  }
}
const bytes = s => new TextEncoder().encode(s).length;

async function submit() {
  if (!items.length || scr !== "main") return;
  // Продукты — id и граммы: калории бот считает сам по своей базе.
  // Мои блюда — готовые цифры: состав хранится в Telegram, бот его не видит; посчитано по той же базе.
  const payload = {
    v: 2,
    i: items.filter(it => !it.own && !it.dish).map(it => [it.id, it.g, it.label || ""]),
    o: items.filter(it => it.own).map(it => {   // [название, ккал, Б, Ж, У, г] — на то, что съедено; пустые БЖУ — null
      const t = ownT(it), e = it.e || [];
      return [it.name.slice(0, 60), Math.round(t.k), ...[1, 2, 3].map(i => e[i] === null || e[i] === undefined ? null
              : r1([t.p, t.f, t.c][i - 1])), Math.round(t.g || 0)];
    }),
    d: items.filter(it => it.dish && dishById(it.dish)).map(it => {
      const d = dishById(it.dish), t = dishItemTotals(it), w = dishUnit(d).byWeight;
      return [d.name.slice(0, 60), w ? "" : it.label, Math.round(t.k), r1(t.p), r1(t.f), r1(t.c), r1(t.fb), w ? Math.round(it.g) : 0];
    }),
    m: misses.slice(),
  };
  let s = JSON.stringify(payload);
  while (bytes(s) > 4000 && payload.m.length) { payload.m.pop(); s = JSON.stringify(payload); }
  if (bytes(s) > 4000) { toast("Слишком много продуктов за раз — запишите в два приёма"); return; }
  await Promise.all([saveRecent(), bumpDishes()]);
  send(s);
}
function send(s) {   // данные уходят боту сообщением; Telegram после этого закрывает приложение
  if (!IN_TG) { console.log("sendData", s); toast("Отправлено (проверка вне Telegram)"); return; }
  try { tg.sendData(s); } catch (e) { toast("Не отправилось: " + e.message); return; }
  // Если приложение не закрылось — Telegram не принял данные (открыто не кнопкой внизу чата)
  setTimeout(() => toast("Не отправилось. Закройте и откройте кнопкой «🍽 Записать еду» внизу чата", 3000), 2500);
}
if (IN_TG) tg.MainButton.onClick(submit);
$("fallbackBtn").addEventListener("click", submit);

function bumpDishes() {   // съеденные блюда — первыми в «Моих блюдах»
  const used = new Set(items.filter(it => it.dish).map(it => it.dish));
  if (!used.size) return Promise.resolve();
  dishes = dishes.filter(d => used.has(d.id)).concat(dishes.filter(d => !used.has(d.id)));
  return withTimeout(saveOrder(), 1000);
}

// ---------- Недавнее: хранится в Telegram (CloudStorage), запасной вариант — память браузера ----------
function loadRecent() {
  return new Promise(resolve => {
    const local = () => ls.get("recent") || "[]";
    const done = v => { try { recent = JSON.parse(v) || []; } catch (e) { recent = []; } resolve(); };
    let finished = false;
    const once = v => { if (!finished) { finished = true; done(v); } };
    setTimeout(() => once(local()), 1500);   // хранилище Telegram не ответило — берём из браузера
    if (CS()) {
      try { tg.CloudStorage.getItem("recent", (err, v) => once(err || !v ? local() : v)); } catch (e) { once(local()); }
    } else once(local());
  });
}
function saveRecent() {
  const now = items.filter(it => !it.dish)   // мои блюда — в своём разделе, в «Недавнем» не повторяем
    .map(it => it.own ? ownToArr(it) : [it.id, it.g, it.label || "", it.unit || "", it.n || 0]);
  const key = r => r[0] === "own" ? "own:" + r[1] : r[0];
  const seen = new Set(), merged = [];
  for (const r of now.concat(recent)) if (!seen.has(key(r))) { seen.add(key(r)); merged.push(r); }
  let value = JSON.stringify(merged.slice(0, 20));
  while (value.length > 4000) { merged.pop(); value = JSON.stringify(merged.slice(0, 20)); }
  return withTimeout(storeSet("recent", value), 1000);   // не ждём дольше секунды
}

// ---------- Подсказка ----------
let toastTimer = null;
function toast(t, ms = 1800) {
  const el = $("toast"); el.textContent = t; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), ms);
}

// ---------- Запуск: сначала маленькая база, магазины — следом; мои блюда — параллельно ----------
(async () => {
  render();
  loadDishes().then(refresh, () => { dishesLoaded = true; refresh(); });
  try {
    const [base] = await Promise.all([fetch(`data/base.json?v=${DATA_VERSION}`).then(r => r.json()), loadRecent()]);
    addBase(base); refresh();
    const off = await fetch(`data/off.json?v=${DATA_VERSION}`).then(r => r.json());
    addOff(off); offLoaded = true; refresh();
  } catch (e) {
    if (scr === "main") view.innerHTML = `<div class="empty">Не получилось загрузить базу продуктов. Закройте и откройте ещё раз.</div>`;
  }
})();
</script>
